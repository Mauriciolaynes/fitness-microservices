version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: fitness-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: fitness-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/fitness-realm.json:/opt/keycloak/data/import/fitness-realm.json
    networks:
      - fitness-net

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: fitness-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - fitness-net

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: fitness-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - fitness-net

  usuario-service:
    build:
      context: .
      dockerfile: usuario-service/Dockerfile
    container_name: fitness-usuario-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuario_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - fitness-net

  membresia-service:
    build:
      context: .
      dockerfile: membresia-service/Dockerfile
    container_name: fitness-membresia-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/membresia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
    networks:
      - fitness-net

  rutina-service:
    build:
      context: .
      dockerfile: rutina-service/Dockerfile
    container_name: fitness-rutina-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rutina_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
    networks:
      - fitness-net

  ejercicio-rutina-service:
    build:
      context: .
      dockerfile: ejercicio-rutina-service/Dockerfile
    container_name: fitness-ejercicio-rutina-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ejercicio_rutina_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      rutina-service:
        condition: service_started
    networks:
      - fitness-net

  progreso-service:
    build:
      context: .
      dockerfile: progreso-service/Dockerfile
    container_name: fitness-progreso-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/progreso_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
    networks:
      - fitness-net

  nutricion-service:
    build:
      context: .
      dockerfile: nutricion-service/Dockerfile
    container_name: fitness-nutricion-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nutricion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
    networks:
      - fitness-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: fitness-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fitness-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-realm/protocol/openid-connect/certs
    depends_on:
      - usuario-service
      - membresia-service
      - rutina-service
      - ejercicio-rutina-service
      - progreso-service
      - nutricion-service
    networks:
      - fitness-net

networks:
  fitness-net:
    driver: bridge

volumes:
  mysql_data:
